services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: uiu_shuttle
      DB_USER: uiu
      DB_PASS: uiu_pass
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: uiu_shuttle
      MYSQL_USER: uiu
      MYSQL_PASSWORD: uiu_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "uiu", "-ppiu_pass"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
